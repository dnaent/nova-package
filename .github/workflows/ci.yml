name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (libmagic for python-magic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Upgrade pip + install pytest
        run: python -m pip install --upgrade pip pytest

      - name: nova-llm-router — install & test
        run: |
          pip install ./nova-llm-router
          pytest nova-llm-router/tests -q

      - name: nova-infra-utils — install & test
        run: |
          pip install ./nova-infra-utils
          pytest nova-infra-utils/tests -q

      - name: nova-agent-sdk — install & import smoke
        run: |
          pip install ./nova-agent-sdk
          python -c "import nova_agent_sdk; print('nova_agent_sdk import OK')"
